---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: write-targets
          image: nginx:1.30.6-alpine
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf '%s:80\n' "$POD_IP" > /targets/targets.txt
              : > /targets/empty.txt
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          volumeMounts:
            - name: targets
              mountPath: /targets
      containers:
        - name: nginx
          image: nginx:1.30.6-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /targets.txt
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: targets
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: targets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
