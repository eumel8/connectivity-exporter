spec:
  template:
    spec:
      containers:
        - name: connectivity-exporter
          image: connectivity-exporter:e2e
          imagePullPolicy: Never
          env:
            - name: TARGETS_URL
              value: http://nginx/targets.txt
            - name: TARGETS_POLL_INTERVAL
              value: "1"
            - name: INTERVAL
              value: "1"
